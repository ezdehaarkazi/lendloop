# Local automation stack: n8n + MailHog (SMTP sink with web UI).
#   docker compose up -d
#   n8n:     http://localhost:5678
#   MailHog: http://localhost:8025
# Secrets come from ./.env (see .env.example) — never hard-code them here.

name: lendloop

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false" # local http only
      N8N_RUNNERS_ENABLED: "true"
      # Workflows read these via $env; values live only in .env / the container.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      LENDLOOP_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?set N8N_WEBHOOK_SECRET in .env}
      LENDLOOP_CONVEX_SITE_URL: ${LENDLOOP_CONVEX_SITE_URL:-http://host.docker.internal:3211}
      NOTIFY_MODE: ${NOTIFY_MODE:-smtp}
      NOTIFY_FROM: ${NOTIFY_FROM:-LendLoop <no-reply@lendloop.local>}
      # Prune old execution data (keeps PII in execution logs short-lived).
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/lendloop:ro
    depends_on:
      - mailhog

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI

volumes:
  n8n_data:
